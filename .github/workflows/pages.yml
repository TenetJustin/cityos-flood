name: Deploy research workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-forecast.txt
      - name: Install weather-model reader
        continue-on-error: true
        run: python -m pip install -r frontend/requirements-forecast.txt
      - name: Build read-only site
        working-directory: frontend
        env:
          VITE_STATIC_PAGES: 'true'
          VITE_BASE_PATH: /cityos-flood/
        run: |
          npm ci
          npm test
          node scripts/fetch-public-observations.mjs
          node scripts/fetch-zhejiang-observations.mjs
          python scripts/fetch_zhejiang_forecast.py --allow-unavailable
          npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
